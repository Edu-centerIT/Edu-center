<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if lesson %}Edit{% else %}Create{% endif %} Lesson - Edu-Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .conditional {
            display: none;
        }
        .conditional.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% if lesson %}Edit Lesson{% else %}Create New Lesson{% endif %}</h1>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="lesson_type">Lesson Type *</label>
                <select id="lesson_type" name="lesson_type" required onchange="toggleLessonType()">
                    <option value="">Select Type</option>
                    <option value="individual" {% if lesson.lesson_type == 'individual' %}selected{% endif %}>Individual</option>
                    <option value="group" {% if lesson.lesson_type == 'group' %}selected{% endif %}>Group</option>
                </select>
            </div>

            <div class="form-group">
                <label for="branch">Branch *</label>
                <select id="branch" name="branch" required>
                    <option value="">Select Branch</option>
                    {% for branch in branches %}
                    <option value="{{ branch.id }}" {% if lesson.branch_id == branch.id %}selected{% endif %}>
                        {{ branch.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="teacher">Teacher *</label>
                <select id="teacher" name="teacher" required>
                    <option value="">Select Teacher</option>
                    {% for teacher in teachers %}
                    <option value="{{ teacher.id }}" {% if lesson.teacher_id == teacher.id %}selected{% endif %}>
                        {{ teacher.first_name }} {{ teacher.last_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="subject">Subject *</label>
                <select id="subject" name="subject" required>
                    <option value="">Select Subject</option>
                    {% for subject in subjects %}
                    <option value="{{ subject.id }}" {% if lesson.subject_id == subject.id %}selected{% endif %}>
                        {{ subject.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div id="student-select" class="form-group conditional">
                <label for="student">Student *</label>
                <select id="student" name="student">
                    <option value="">Select Student</option>
                    {% for student in students %}
                    <option value="{{ student.id }}" {% if lesson.student_id == student.id %}selected{% endif %}>
                        {{ student.first_name }} {{ student.last_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div id="group-select" class="form-group conditional">
                <label for="group">Group *</label>
                <select id="group" name="group">
                    <option value="">Select Group</option>
                    {% for group in groups %}
                    <option value="{{ group.id }}" {% if lesson.group_id == group.id %}selected{% endif %}>
                        {{ group.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date" value="{{ lesson.date }}" required>
            </div>

            <div class="form-group">
                <label for="start_time">Start Time *</label>
                <input type="time" id="start_time" name="start_time" value="{{ lesson.start_time }}" required>
            </div>

            <div class="form-group">
                <label for="end_time">End Time *</label>
                <input type="time" id="end_time" name="end_time" value="{{ lesson.end_time }}" required>
            </div>

            <button type="submit">{% if lesson %}Update{% else %}Create{% endif %}</button>
            <a href="{% url 'lesson_list' %}" style="margin-left: 10px; color: #667eea; text-decoration: none;">Cancel</a>
        </form>
    </div>

    <script>
        function toggleLessonType() {
            const type = document.getElementById('lesson_type').value;
            document.getElementById('student-select').classList.toggle('show', type === 'individual');
            document.getElementById('group-select').classList.toggle('show', type === 'group');
        }
        
        // Initialize on page load
        window.addEventListener('load', toggleLessonType);
    </script>
</body>
</html>
