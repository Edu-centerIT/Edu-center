<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ branch.name }} - Edu-Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin: 5px;
        }
        .btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ branch.name }}</h1>

        <p><strong>City:</strong> {{ branch.city }}</p>
        <p><strong>Address:</strong> {{ branch.address }}</p>
        <p><strong>Status:</strong> {{ branch.status }}</p>
        <p><strong>Active Students:</strong> {{ students_count }}</p>
        <p><strong>Scheduled Lessons:</strong> {{ lessons_count }}</p>

        <div style="margin-top: 20px;">
            <a href="{% url 'branch_edit' branch.pk %}" class="btn">Edit</a>
            <a href="{% url 'branch_archive' branch.pk %}" class="btn">Archive</a>
            <a href="{% url 'branch_list' %}" class="btn">Back to List</a>
        </div>
    </div>
</body>
</html>
