<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Groups - Edu-Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .navbar {
            background: #333;
            color: white;
            padding: 15px 30px;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
        }
        a {
            color: #667eea;
            text-decoration: none;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>👫 Groups Management</h1>
    </div>

    <div class="container">
        <a href="{% url 'dashboard' %}" class="btn">← Back</a>
        <a href="{% url 'group_create' %}" class="btn">+ Create Group</a>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Members</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for group in groups %}
                <tr>
                    <td>{{ group.name }}</td>
                    <td>{{ group.branch.name }}</td>
                    <td>{{ group.students.count }}</td>
                    <td>{{ group.status }}</td>
                    <td>
                        <a href="{% url 'group_detail' group.pk %}">View</a>
                        <a href="{% url 'group_edit' group.pk %}">Edit</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
