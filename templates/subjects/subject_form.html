<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if is_edit %}Edit{% else %}Create{% endif %} Subject - Edu-Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% if is_edit %}Edit Subject{% else %}Create New Subject{% endif %}</h1>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Subject Name *</label>
                <input type="text" id="name" name="name" value="{{ subject.name }}" required>
            </div>

            <div class="form-group">
                <label for="branch">Branch *</label>
                <select id="branch" name="branch" required {% if is_edit %}disabled{% endif %}>
                    <option value="">Select Branch</option>
                    {% for branch in branches %}
                    <option value="{{ branch.id }}" {% if subject.branch_id == branch.id %}selected{% endif %}>
                        {{ branch.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">{% if is_edit %}Update{% else %}Create{% endif %}</button>
            <a href="{% url 'subject_list' %}" style="margin-left: 10px; color: #667eea; text-decoration: none;">Cancel</a>
        </form>
    </div>
</body>
</html>
