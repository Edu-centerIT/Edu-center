<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mark Attendance - Edu-Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        .student-row {
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mark Attendance</h1>
        <p><strong>Lesson:</strong> {{ lesson.subject.name }} - {{ lesson.date }} {{ lesson.start_time }}</p>

        <form method="post">
            {% csrf_token %}

            {% for item in student_attendance %}
            <div class="student-row">
                <h3>{{ item.student.first_name }} {{ item.student.last_name }}</h3>
                
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="is_present_{{ item.student.id }}" 
                            {% if item.attendance.is_present %}checked{% endif %}>
                        Present
                    </label>
                </div>

                <textarea name="notes_{{ item.student.id }}" placeholder="Notes...">{{ item.attendance.notes }}</textarea>
            </div>
            {% endfor %}

            <button type="submit">Save Attendance</button>
            <a href="{% url 'lesson_detail' lesson.pk %}" style="margin-left: 10px; color: #667eea; text-decoration: none;">Cancel</a>
        </form>
    </div>
</body>
</html>
