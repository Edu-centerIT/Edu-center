<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if branch %}Edit{% else %}Create{% endif %} Branch - Edu-Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% if branch %}Edit Branch{% else %}Create New Branch{% endif %}</h1>

        {% if messages %}
        <div style="background: #fee; padding: 10px; border-radius: 5px; margin-bottom: 20px;">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Branch Name</label>
                <input type="text" id="name" name="name" value="{{ branch.name }}" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" value="{{ branch.address }}" required>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" value="{{ branch.city }}" required>
            </div>

            <button type="submit">{% if branch %}Update{% else %}Create{% endif %}</button>
            <a href="{% url 'branch_list' %}" style="margin-left: 10px; color: #667eea; text-decoration: none;">Cancel</a>
        </form>
    </div>
</body>
</html>
