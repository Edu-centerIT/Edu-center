<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Edu-Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            margin: 10px 10px 10px 0;
            border-radius: 5px;
            text-decoration: none;
        }
        a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Edu-Center</h1>
        <p>Role: {{ role }}</p>
        <p><a href="{% url 'logout' %}">Logout</a></p>
    </div>
</body>
</html>
